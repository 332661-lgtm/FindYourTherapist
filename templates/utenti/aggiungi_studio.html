{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/profilo.css' %}?v=6">
{% endblock %}

{% block contenuto %}
<div class="profilo-container" style="max-width: 500px; margin-top: 60px;">
    <div class="profilo-header">
        <h2>Registra Nuova Sede</h2>
        <p>Aggiungi un nuovo ambulatorio al database.</p>
    </div>

    <form method="POST" action="{% url 'utenti:aggiungi_studio' %}">
        {% csrf_token %}
        
        <div style="margin-bottom: 15px;">
            <label style="font-weight: bold; display: block; margin-bottom: 5px;">Città</label>
            <input type="text" name="citta" placeholder="Es. Pescara" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 25px;">
            <label style="font-weight: bold; display: block; margin-bottom: 5px;">Indirizzo completo</label>
            <input type="text" name="indirizzo" placeholder="Es. Via Roma 15" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
        </div>

        <div style="display: flex; gap: 10px;">
            <a href="{% url 'utenti:profilo_terapeuta' %}" class="btn-secondary-small" style="text-decoration: none; text-align: center; width: 40%; display: block; padding: 12px;">Annulla</a>
            <button type="submit" class="profilo-btn-salva" style="margin-top: 0; width: 60%;">Registra Sede</button>
        </div>
    </form>
</div>
{% endblock %}
