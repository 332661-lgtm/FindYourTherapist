{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/auth.css' %}?v=1">
{% endblock %}

{% block contenuto %}
<div class="auth-container" style="text-align: center; padding: 40px 20px;">
    <div style="font-size: 3em; margin-bottom: 10px;">✅</div>
    <h2 class="auth-title" style="margin-bottom: 15px; color: #2e8b57;">Password aggiornata!</h2>
    <p style="color: #555; line-height: 1.6;">
        La tua password è stata modificata con successo. Ora puoi effettuare l'accesso con le tue nuove credenziali.
    </p>
    <a href="{% url 'utenti:accedi' %}" class="btn-submit" style="display: inline-block; margin-top: 25px; text-decoration: none; max-width: 200px;">Vai al Login</a>
</div>
{% endblock %}
